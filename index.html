<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reimu & Marisa & Sakuya vs Mamizou - Special Bomb Edition</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; touch-action: none; font-family: sans-serif; }
        canvas { display: block; background: #050510; }
        #ui {
            position: absolute; top: 15px; left: 15px; color: white; 
            pointer-events: none; text-shadow: 2px 2px 4px #000;
        }
        #bomb-btn, #switch-btn {
            position: absolute; border-radius: 50%; border: 2px solid white;
            color: white; font-weight: bold; display: flex;
            align-items: center; justify-content: center; z-index: 10;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }
        #bomb-btn {
            bottom: 30px; right: 30px; width: 80px; height: 80px;
            background: rgba(255, 0, 0, 0.6); box-shadow: 0 0 15px red;
        }
        #switch-btn {
            bottom: 30px; left: 30px; width: 80px; height: 80px;
            background: rgba(0, 255, 100, 0.4); box-shadow: 0 0 15px green;
        }
        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); color: white; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; text-align: center;
        }

    </style>
</head>
<body>

    <div id="start-overlay">
        <h1 style="color: #ff44ff;">TOUHOU FIGHT - SPECIAL BOMB</h1>
        <p> Reimu & Marisa & Sakuya vs Mamizou</p>
        <div style="margin-top: 20px; padding: 15px; border: 2px solid #fff;">TAP TO START</div>
    </div>

    <div id="ui">
        Boss HP: <span id="hp-val">4500</span><br>
        Char: <span id="char-name" style="color: #44aaff;">REIMU</span><br>
        Bombs: <span id="bomb-val">3</span><br>

Graze: <span id="graze-val">0</span>

    </div>

    <div id="switch-btn">SWITCH</div>
    <div id="bomb-btn">BOMB</div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

const imgReimu = new Image();
const imgMarisa = new Image();
const imgMamizou = new Image();
const imgSakuya = new Image();

imgReimu.src = "https://i.ibb.co/twm06KF3/image.png";
imgMarisa.src = "https://i.ibb.co/bYzf4KP/image.png";
imgMamizou.src = "https://i.ibb.co/pjSsxDZv/image.png";
imgSakuya.src = "https://i.ibb.co/bjfQGhQv/image.png";

let timeStop = 0;

        let gameStarted = false, currentPlayer = "reimu", isGameOver = false;

let player = {
    x: canvas.width/2,
    y: canvas.height - 150,
    r: 1,
    visualR: 15,
    bombs: 3,
    invuln: 0
};

        let boss = { x: canvas.width/2, y: 150, hp: 4500, maxHp: 4500, r: 35 };
        let enemyBullets = [], playerBullets = [], lasers = [], bombEffects = [];
        let bombTimer = 0, shake = 0, frame = 0;

let graze = 0;
let grazeCooldown = 0;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playGraze() {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "square";
    osc.frequency.value = 1200;

    gain.gain.value = 0.03;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.03);
}

function getHitbox() {
    return currentPlayer === "reimu" ? 0.5 : 1;
}

        class Bullet {
            constructor(x, y, angle, speed, color, radius = 4, damage = 1.8, isHoming = false) {
                this.x = x; this.y = y; this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                this.color = color; this.radius = radius; this.damage = damage; this.isHoming = isHoming;
            }
            update() {
                if (this.isHoming) {
                    let angleToBoss = Math.atan2(boss.y - this.y, boss.x - this.x);
                    this.vx += Math.cos(angleToBoss) * 0.5;
                    this.vy += Math.sin(angleToBoss) * 0.5;
                    let speed = Math.hypot(this.vx, this.vy);
                    if (speed > 8) { this.vx *= 8/speed; this.vy *= 8/speed; }
                }
                this.x += this.vx; this.y += this.vy;
            }
            draw() {

if (currentPlayer === "sakuya" && this.isHoming) {

    ctx.save();

    let angle = Math.atan2(this.vy, this.vx);
    ctx.translate(this.x, this.y);
    ctx.rotate(angle);

    // 🔷 thân dao (xanh biển)
    ctx.fillStyle = "#3399ff";
    ctx.fillRect(-14, -2, 24, 4);

    // 🔷 đầu dao (dài + nhọn hơn)
    ctx.beginPath();
    ctx.moveTo(10, -4);
    ctx.lineTo(18, 0);
    ctx.lineTo(10, 4);
    ctx.closePath();
    ctx.fill();

    // ✝️ thanh dọc (thập giá ngược)
    ctx.fillRect(-10, -10, 4, 20);

    // ✨ lõi sáng
    ctx.fillStyle = "white";
    ctx.fillRect(-14, -1, 24, 2);
    ctx.fillRect(-9, -7, 2, 14);

    // 🌟 glow xanh nhẹ
    ctx.strokeStyle = "rgba(100,180,255,0.7)";
    ctx.lineWidth = 1;
    ctx.strokeRect(-14, -2, 24, 4);

    ctx.restore();

    return;
}

                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();
                if (this.isHoming) { // Hiệu ứng hào quang cho Orb của Reimu
                    ctx.strokeStyle = "white"; ctx.lineWidth = 2; ctx.stroke();
                }
            }
        }

        class Laser {
    constructor() {
        this.reset();
    }

    reset() {
        this.timer = 0;

        // 🎲 random hướng
        this.side = Math.random() < 0.5 ? "left" : "right";

        this.currentX = (this.side === "left") ? -300 : canvas.width + 300;
        this.speed = (this.side === "left") ? 5 : -5;

        this.targetY = player.y;
        this.active = true;
        this.firing = false;
    }

    update() {
        this.timer++;

        // lock vị trí player lúc bắt đầu
        if (this.timer === 1) {
            this.targetY = player.y;
        }

        // bắt đầu bắn ngay
        if (this.timer > 10) {
            this.firing = true;
        }

        // 🚀 bay thẳng luôn (mượt hơn lerp)
        this.currentX += this.speed;

        // ra khỏi màn → reset
        if (
            this.currentX < -400 ||
            this.currentX > canvas.width + 400
        ) {
            this.reset();
        }
    }
            draw() {
    if (!this.active) return;

    let w = 90;
    let h = 22;

    ctx.save();
    ctx.translate(this.currentX, this.targetY);

    // thân tàu
    ctx.fillStyle = "#ffcc00";
    ctx.fillRect(-w/2, -h/2, w, h);

    // đầu tàu
    ctx.fillStyle = "#ff4444";
    ctx.beginPath();
    ctx.moveTo(w/2, 0);
    ctx.lineTo(w/2 + 40, -18);
    ctx.lineTo(w/2 + 40, 18);
    ctx.closePath();
    ctx.fill();

    // cửa sổ
    ctx.fillStyle = "white";
    for (let i = -30; i <= 30; i += 15) {
        ctx.fillRect(i, -3, 5, 6);
    }

    ctx.restore();
}
}
        lasers = [new Laser()];

        document.getElementById("start-overlay").addEventListener("touchstart", () => {
            gameStarted = true; document.getElementById("start-overlay").style.display = "none"; requestAnimationFrame(draw);
        }, { once: true });

let lastTouchX = null;
let lastTouchY = null;

window.addEventListener("touchstart", (e) => {

    if (!gameStarted || isGameOver || boss.hp <= 0) return;

    lastTouchX = e.touches[0].clientX;
    lastTouchY = e.touches[0].clientY;

}, { passive: false });

window.addEventListener("touchmove", (e) => {

    if (!gameStarted || isGameOver || boss.hp <= 0) return;

    e.preventDefault();

    let touchX = e.touches[0].clientX;
    let touchY = e.touches[0].clientY;

    // 👆 lượng vuốt
    let dx = touchX - lastTouchX;
    let dy = touchY - lastTouchY;

    // 🎮 di chuyển kiểu swipe
    player.x += dx;
    player.y += dy;

    // cập nhật touch cuối
    lastTouchX = touchX;
    lastTouchY = touchY;

    // giới hạn màn hình
    player.x = Math.max(10, Math.min(canvas.width - 10, player.x));
    player.y = Math.max(10, Math.min(canvas.height - 10, player.y));

}, { passive: false });

window.addEventListener("touchend", () => {

    lastTouchX = null;
    lastTouchY = null;

});

document.getElementById("switch-btn").addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (isGameOver) return;

   if (currentPlayer === "reimu") currentPlayer = "marisa";
else if (currentPlayer === "marisa") currentPlayer = "sakuya";
else currentPlayer = "reimu";

    document.getElementById("char-name").innerText = currentPlayer.toUpperCase();
    document.getElementById("char-name").style.color =
    (currentPlayer === "reimu") ? "#44aaff" :
    (currentPlayer === "marisa") ? "#ffff00" :
    "#cccccc";
});

        document.getElementById("bomb-btn").addEventListener("touchstart", (e) => {
            e.preventDefault();
            if (player.bombs > 0 && !isGameOver && bombTimer === 0) {
                player.bombs--; document.getElementById("bomb-val").innerText = player.bombs;
                bombTimer = 120; shake = 10; player.invuln = 150;
                if (currentPlayer === "reimu") { // Fantasy Seal
                    for (let i = 0; i < 7; i++) {
                        bombEffects.push(new Bullet(player.x, player.y, (i * Math.PI * 2 / 7), 5, "#ff0088", 12, 60, true));
                    }
                }

if (currentPlayer === "sakuya") {
    timeStop = 120;

    // 💥 bắn dao mọi hướng
    for (let i = 0; i < 40; i++) {
        let angle = (i / 40) * Math.PI * 2;

        playerBullets.push(
            new Bullet(
                player.x,
                player.y,
                angle,
                10,
                "#3399ff",
                3,
                15,
                true // 👈 QUAN TRỌNG: homing để hiện dao
            )
        );
    }
}

                if (navigator.vibrate) navigator.vibrate(200);
            }
        });

function spawnDanmaku() {

    if (timeStop > 0) return;

    frame++;

    if (boss.hp <= 1000) {

        cycle = 2500;

    } else {

        cycle = frame % 2400;
    }

    if (timeStop <= 0) {
        boss.x =
            (canvas.width / 2) +
            Math.sin(frame * 0.01) *
            (canvas.width / 4);
    }

    if (bombTimer > 0) {
        enemyBullets = [];
        return;
    }

if (cycle < 200) {

    let local = cycle;

    if (typeof this.mamizouSpin === "undefined") {
        this.mamizouSpin = 0;
    }

    let shooting = false;
    let spinSpeed = 0;

    if (local < 120) {
        shooting = true;
        spinSpeed = 10;
    }

    else if (local < 180) {
        shooting = true;
        spinSpeed = 0.08;
    }

    else if (local < 210) {
        shooting = false;
    }

    else {
        shooting = true;
        spinSpeed = 10;
    }

    this.mamizouSpin += spinSpeed;

    if (shooting && frame % 10 === 0) {

        const total = 18;

        for (let i = 0; i < total; i++) {

            enemyBullets.push(
                new Bullet(
                    boss.x,
                    boss.y,
                    this.mamizouSpin + i * Math.PI * 2 / total,
                    4,
                    "#ff8888",
                    20
                )
            );
        }
    }
} else if (cycle < 400) {

    let local = cycle - 200;

    if (typeof this.pattern2Spin === "undefined") {
        this.pattern2Spin = 0;
    }

    let shooting = (local % 120) < 90;

    this.pattern2Spin += 0.12;

    if (shooting && frame % 10 === 0) {

        const total = 18;

        for (let i = 0; i < total; i++) {

            let angle =
                this.pattern2Spin +
                i * (Math.PI * 2 / total);

            enemyBullets.push(
                new Bullet(
                    boss.x,
                    boss.y,
                    angle,
                    4,
                    "yellow",
                    20
                )
            );
        }
    }

} else if (cycle < 800) {

    if (frame % 30 === 0) {

        const total = 20;

        for (let i = 0; i < total; i++) {

            let ang = i * Math.PI * 2 / total;

            let b = new Bullet(
                boss.x,
                boss.y,
                ang,
                3.8,
                i % 2 ? "#44bbff" : "red",
                20
            );

            b.angle = ang;
            b.speed = 3.8;
            b.wave = Math.random() * Math.PI * 2;
            b.dir = Math.random() < 0.5 ? -1 : 1;

            b.update = function () {

                this.wave += 0.04;

                // đổi hướng rất nhẹ
                this.angle += Math.sin(this.wave) * 0.02 * this.dir;

                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

            };

            enemyBullets.push(b);

        }

    }

}

else if (cycle < 1200) {

    if (frame % 100 === 0) {

        const total = 16;

        for (let i = 0; i < total; i++) {

            let b = new Bullet(
                boss.x,
                boss.y,
                i * Math.PI * 2 / total,
                4,
                "#00bfff",
                8
            );

            b.state = 0;      // 0 = đạn, 1 = người, 2 = đi tiếp
            b.wait = 0;
            b.shot = false;

            b.update = function () {

                if (this.state === 0) {

                    this.x += this.vx;
                    this.y += this.vy;

                    if (
        b.x <= 8 ||
        b.x >= canvas.width - 8 ||
        b.y <= 8 ||
        b.y >= canvas.height - 8
                    ) {
                        this.state = 1;
                        this.wait = 45;
                        this.vx = 0;
                        this.vy = 0;
                    }

                } else if (this.state === 1) {

                    this.wait--;

                    if (!this.shot) {

                        this.shot = true;

                        let ang = Math.atan2(
                            player.y - this.y,
                            player.x - this.x
                        );

                        enemyBullets.push(
                            new Bullet(
                                this.x,
                                this.y,
                                ang,
                                4,
                                "yellow",
                                4
                            )
                        );
                    }

                    if (this.wait <= 0) {

                        this.state = 2;

                        if (this.x < 10) {
                            this.vx = -3;
                            this.vy = 0;
                        }
                        else if (this.x > canvas.width - 10) {
                            this.vx = 3;
                            this.vy = 0;
                        }
                        else if (this.y < 10) {
                            this.vx = 0;
                            this.vy = -3;
                        }
                        else {
                            this.vx = 0;
                            this.vy = 3;
                        }
                    }

                } else {

                    this.x += this.vx;
                    this.y += this.vy;

                }

            };

            b.draw = function () {

                if (this.state === 1) {

                    ctx.save();
                    ctx.translate(this.x, this.y);

                    ctx.strokeStyle = "#00bfff";
                    ctx.lineWidth = 2;

                    // đầu
                    ctx.beginPath();
                    ctx.arc(0, -10, 4, 0, Math.PI * 2);
                    ctx.stroke();

                    // thân
                    ctx.beginPath();
                    ctx.moveTo(0, -6);
                    ctx.lineTo(0, 8);

                    // tay
                    ctx.moveTo(-6, 0);
                    ctx.lineTo(6, 0);

                    // chân
                    ctx.moveTo(0, 8);
                    ctx.lineTo(-5, 16);

                    ctx.moveTo(0, 8);
                    ctx.lineTo(5, 16);

                    ctx.stroke();

                    ctx.restore();

                } else {

                    ctx.fillStyle = "#00bfff";
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 8, 0, Math.PI * 2);
                    ctx.fill();

                }

            };

            enemyBullets.push(b);
        }

    }

}

else if (cycle < 1600) {

    if (frame % 12 === 0) {

        let sx;

        // Không spawn ở giữa
        if (Math.random() < 0.5) {
            sx = Math.random() * (canvas.width * 0.35);
        } else {
            sx = canvas.width * 0.65 + Math.random() * (canvas.width * 0.35);
        }

        let b = new Bullet(
            sx,
            0,
            Math.PI / 2,
            4,
            "lime",
            8
        );

        b.isDog = false;
        b.targetX = player.x;

b.update = function () {

    if (!this.isDog) {

        this.y += 4;

        // Đến y của player thì hóa chó
        if (this.y >= player.y) {

            this.isDog = true;
            this.vy = 0;

            if (this.x < this.targetX) {
                this.vx = 3;
            } else {
                this.vx = -3;
            }
        }

    } else {

        this.x += this.vx;

    }
};

b.draw = function () {

    if (!this.isDog) {

        ctx.fillStyle = "lime";
        ctx.beginPath();
        ctx.arc(this.x, this.y, 8, 0, Math.PI * 2);
        ctx.fill();

    } else {

        ctx.save();
        ctx.translate(this.x, this.y);

        ctx.strokeStyle = "lime";
        ctx.lineWidth = 2;

        // đầu
        ctx.beginPath();
        ctx.arc(-8, -2, 5, 0, Math.PI * 2);
        ctx.stroke();

        // tai trái
        ctx.beginPath();
        ctx.moveTo(-11, -6);
        ctx.lineTo(-14, -11);
        ctx.lineTo(-8, -8);
        ctx.stroke();

        // tai phải
        ctx.beginPath();
        ctx.moveTo(-5, -6);
        ctx.lineTo(-2, -11);
        ctx.lineTo(-8, -8);
        ctx.stroke();

        // thân
        ctx.beginPath();
        ctx.ellipse(6, 2, 12, 7, 0, 0, Math.PI * 2);
        ctx.stroke();

        // chân trước
        ctx.beginPath();
        ctx.moveTo(0, 8);
        ctx.lineTo(0, 15);
        ctx.moveTo(6, 8);
        ctx.lineTo(6, 15);
        ctx.stroke();

        // chân sau
        ctx.beginPath();
        ctx.moveTo(12, 8);
        ctx.lineTo(12, 15);
        ctx.moveTo(18, 8);
        ctx.lineTo(18, 15);
        ctx.stroke();

        // đuôi
        ctx.beginPath();
        ctx.moveTo(18, 0);
        ctx.lineTo(25, -6);
        ctx.lineTo(22, -1);
        ctx.stroke();

        ctx.restore();
    }
};

        enemyBullets.push(b);
    }
}

else if (cycle < 2000) {

    if (frame % 50 === 0) {

        const total = 14;

        for (let i = 0; i < total; i++) {

            let angle = i * Math.PI * 2 / total;

            let b = new Bullet(
                boss.x,
                boss.y,
                angle,
                2.5,
                "red",
                8
            );

            b.timer = 0;
            b.isBird = false;

            b.update = function () {

                this.timer++;

                // Bay tỏa bình thường
                if (!this.isBird) {
                    this.x += this.vx;
                    this.y += this.vy;

                    // Sau khoảng 1 giây biến thành chim
                    if (this.timer >= 60) {
                        this.isBird = true;
                        this.vx = 0;
                        this.vy = 3;
                    }
                }
                else {
                    this.x += this.vx;
                    this.y += this.vy;
                }
            };

b.draw = function () {

    if (!this.isBird) {

        ctx.fillStyle = "red";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();

    } else {

        ctx.save();
        ctx.translate(this.x, this.y);

        ctx.strokeStyle = "red";
        ctx.lineWidth = 2;

        // cánh trái (chỉ viền)
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(-10, -8, -18, 0);
        ctx.stroke();

        // cánh phải (chỉ viền)
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(10, -8, 18, 0);
        ctx.stroke();

        ctx.restore();
    }
};

            enemyBullets.push(b);
        }
    }
}

else if (cycle < 2400) {

    if (frame % 10 === 0) {

        if (typeof this.pattern6Spin === "undefined") {
            this.pattern6Spin = 0;
        }

        this.pattern6Spin += 0.2;

        for (let i = 0; i < 4; i++) {

            let ang = this.pattern6Spin + i * Math.PI * 2 / 4;

            let b = new Bullet(
                boss.x,
                boss.y,
                ang,
                3,
                "#88ddff",
                8
            );

            b.timer = 0;
            b.isFrog = false;
            b.done = false;

            b.update = function () {

                this.timer++;

                if (!this.isFrog) {

                    this.x += this.vx;
                    this.y += this.vy;

                    // Bay 1 lúc thì hóa ếch
                    if (this.timer >= 60) {
                        this.isFrog = true;
                        this.timer = 0;
                        this.vx = 0;
                        this.vy = 0;
                    }

                } else {

                    // Sau 1 giây bắn rồi biến mất
                    if (!this.done && this.timer >= 60) {

                        this.done = true;

                        for (let k = 0; k < 4; k++) {

                            enemyBullets.push(
                                new Bullet(
                                    this.x,
                                    this.y,
                                    k * Math.PI / 2,
                                    4,
                                    "yellow",
                                    4
                                )
                            );

                        }

                        this.x = -9999;
                        this.y = -9999;
                    }

                }

            };

            b.draw = function () {

                if (!this.isFrog) {

                    ctx.fillStyle = "#88ddff";
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 8, 0, Math.PI * 2);
                    ctx.fill();

                } else {

                    ctx.save();
                    ctx.translate(this.x, this.y);

                    ctx.strokeStyle = "#88ddff";
                    ctx.lineWidth = 2;

                    // đầu
                    ctx.beginPath();
                    ctx.arc(0, -4, 6, 0, Math.PI * 2);
                    ctx.stroke();

                    // mắt
                    ctx.beginPath();
                    ctx.arc(-4, -9, 2, 0, Math.PI * 2);
                    ctx.arc(4, -9, 2, 0, Math.PI * 2);
                    ctx.stroke();

                    // thân
                    ctx.beginPath();
                    ctx.ellipse(0, 5, 8, 6, 0, 0, Math.PI * 2);
                    ctx.stroke();

                    // chân
                    ctx.beginPath();
                    ctx.moveTo(-5, 10);
                    ctx.lineTo(-10, 16);
                    ctx.moveTo(5, 10);
                    ctx.lineTo(10, 16);
                    ctx.stroke();

                    ctx.restore();

                }

            };

            enemyBullets.push(b);

        }

    }

}

else if (boss.hp <= 1000) {

    let targetX =
        canvas.width / 2 +
        Math.sin(frame * 0.012) * 180;

    let targetY = -120;

    boss.x += (targetX - boss.x) * 0.08;
    boss.y += (targetY - boss.y) * 0.06;

    const clones = [
        { x: 80, y: 120, type: "bird" },
        { x: 80, y: 260, type: "dog" },
        { x: 80, y: 400, type: "human" },

        { x: canvas.width - 80, y: 120, type: "bird" },
        { x: canvas.width - 80, y: 260, type: "dog" },
        { x: canvas.width - 80, y: 400, type: "human" }
    ];

    if (frame % 40 === 0) {

        clones.forEach(c => {

            if (c.type === "bird") {

                let ang = Math.atan2(
                    player.y - c.y,
                    player.x - c.x
                );

                for (let i = -1; i <= 1; i++) {

                    let b = new Bullet(
                        c.x,
                        c.y,
                        ang + i * 0.15,
                        3,
                        "red",
                        8
                    );

                    b.timer = 0;
                    b.isBird = false;

                    b.update = function () {

                        this.timer++;

                        this.x += this.vx;
                        this.y += this.vy;

                        if (this.timer >= 60) {
                            this.isBird = true;
                        }
                    };

                    b.draw = function () {

                        if (!this.isBird) {

                            ctx.fillStyle = "red";
                            ctx.beginPath();
                            ctx.arc(this.x,this.y,8,0,Math.PI*2);
                            ctx.fill();

                        } else {

                            ctx.save();
                            ctx.translate(this.x,this.y);

                            ctx.strokeStyle = "red";
                            ctx.lineWidth = 2;

                            ctx.beginPath();
                            ctx.moveTo(0,0);
                            ctx.quadraticCurveTo(-10,-8,-18,0);
                            ctx.stroke();

                            ctx.beginPath();
                            ctx.moveTo(0,0);
                            ctx.quadraticCurveTo(10,-8,18,0);
                            ctx.stroke();

                            ctx.restore();

                        }

                    };

                    enemyBullets.push(b);

                }

} else if (c.type === "dog") {

    [-Math.PI / 2, Math.PI / 2].forEach(angle => {

        let b = new Bullet(
            c.x,
            c.y,
            angle,
            4,
            "lime",
            8
        );

        b.isDog = false;
        b.targetX = player.x;

b.update = function () {

    if (!this.isDog) {

        this.y += 4;

        // Đến y của player thì hóa chó
        if (this.y >= player.y) {

            this.isDog = true;
            this.vy = 0;

            if (this.x < this.targetX) {
                this.vx = 3;
            } else {
                this.vx = -3;
            }
        }

    } else {

        this.x += this.vx;

    }
};

        b.draw = function () {

            if (!this.isDog) {

                ctx.fillStyle = "lime";
                ctx.beginPath();
                ctx.arc(
                    this.x,
                    this.y,
                    8,
                    0,
                    Math.PI * 2
                );
                ctx.fill();

            } else {

                ctx.save();
                ctx.translate(this.x, this.y);

                ctx.strokeStyle = "lime";
                ctx.lineWidth = 2;


        // đầu
        ctx.beginPath();
        ctx.arc(-8, -2, 5, 0, Math.PI * 2);
        ctx.stroke();

        // tai trái
        ctx.beginPath();
        ctx.moveTo(-11, -6);
        ctx.lineTo(-14, -11);
        ctx.lineTo(-8, -8);
        ctx.stroke();

        // tai phải
        ctx.beginPath();
        ctx.moveTo(-5, -6);
        ctx.lineTo(-2, -11);
        ctx.lineTo(-8, -8);
        ctx.stroke();

        // thân
        ctx.beginPath();
        ctx.ellipse(6, 2, 12, 7, 0, 0, Math.PI * 2);
        ctx.stroke();

        // chân trước
        ctx.beginPath();
        ctx.moveTo(0, 8);
        ctx.lineTo(0, 15);
        ctx.moveTo(6, 8);
        ctx.lineTo(6, 15);
        ctx.stroke();

        // chân sau
        ctx.beginPath();
        ctx.moveTo(12, 8);
        ctx.lineTo(12, 15);
        ctx.moveTo(18, 8);
        ctx.lineTo(18, 15);
        ctx.stroke();

        // đuôi
        ctx.beginPath();
        ctx.moveTo(18, 0);
        ctx.lineTo(25, -6);
        ctx.lineTo(22, -1);
        ctx.stroke();


                ctx.restore();

            }

        };

        enemyBullets.push(b);

    });

            } else {

                [-Math.PI / 2, Math.PI / 2].forEach(angle => {

                    let b = new Bullet(
                        c.x,
                        c.y,
                        angle,
                        4,
                        "#00bfff",
                        8
                    );

                    b.draw = function () {

                        ctx.save();
                        ctx.translate(this.x,this.y);

                        ctx.strokeStyle = "#00bfff";
                        ctx.lineWidth = 2;

                        ctx.beginPath();
                        ctx.arc(0,-10,4,0,Math.PI*2);
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.moveTo(0,-6);
                        ctx.lineTo(0,8);

                        ctx.moveTo(-6,0);
                        ctx.lineTo(6,0);

                        ctx.moveTo(0,8);
                        ctx.lineTo(-5,16);

                        ctx.moveTo(0,8);
                        ctx.lineTo(5,16);

                        ctx.stroke();

                        ctx.restore();

                    };

                    enemyBullets.push(b);

                });

            }

        });

    }

}

if (currentPlayer === "reimu" && frame % 5 === 0) {
    playerBullets.push(new Bullet(player.x - 8, player.y, -Math.PI/2, 8, "#44aaff", 3, 2, true));
    playerBullets.push(new Bullet(player.x + 8, player.y, -Math.PI/2, 8, "#44aaff", 3, 2, true));
} 

else if (currentPlayer === "marisa" && frame % 5 === 0) {
    playerBullets.push(new Bullet(player.x, player.y, -Math.PI/2, 10, "#ffff00", 8, 6));
}

else if (currentPlayer === "sakuya" && frame % 10 === 0) {
    playerBullets.push(
        new Bullet(player.x, player.y, -Math.PI/2, 14, "#3399ff", 3, 10, true) // 👈 bật homing
    );
}

        }

        function update() {

if (grazeCooldown > 0) grazeCooldown--;

document.getElementById("graze-val").innerText = graze;

if (timeStop > 0) {
    timeStop--;

    // Hết Time Stop -> xóa toàn bộ đạn địch
    if (timeStop === 0) {
        enemyBullets.length = 0;
    }
}

if (boss.hp <= 1000 && boss.hp > 0) {
    boss.hp -= 0.5
}

            if (isGameOver || boss.hp <= 0 || !gameStarted) return;
            if (player.invuln > 0) player.invuln--;
            if (shake > 0) shake *= 0.9;
            if (bombTimer > 0) {
                bombTimer--;
                if (currentPlayer === "marisa") { boss.hp -= 5; shake = 5; } // Master Spark liên tục gây dam
            }
            spawnDanmaku();

lasers.forEach(l => {

});

            enemyBullets.forEach((b, i) => {
    if (timeStop <= 0) b.update();

let dist = Math.hypot(b.x - player.x, b.y - player.y);

if (
    dist < getHitbox() + b.radius + 18 &&
    dist > getHitbox() + b.radius &&
    grazeCooldown === 0
) {
    graze++;
    grazeCooldown = 3;
    playGraze();
}

if (player.invuln === 0 && Math.hypot(b.x - player.x, b.y - player.y) < getHitbox() + b.radius) {
    isGameOver = true;
    alert("GAME OVER");
}

                if (b.y > canvas.height || b.y < 0 || b.x > canvas.width || b.x < 0) enemyBullets.splice(i, 1);
            });

            bombEffects.forEach((orb, i) => {
                orb.update();
                if (Math.hypot(orb.x - boss.x, orb.y - boss.y) < boss.r + orb.radius) { boss.hp -= orb.damage; bombEffects.splice(i, 1); }
            });

            playerBullets.forEach((pb, i) => {
                pb.update();
                if (Math.hypot(pb.x - boss.x, pb.y - boss.y) < boss.r) { boss.hp -= pb.damage; playerBullets.splice(i, 1); }
                if (pb.y < 0) playerBullets.splice(i, 1);
            });
            document.getElementById("hp-val").innerText = Math.max(0, Math.floor(boss.hp));
            if (boss.hp <= 0) { alert("VICTORY!"); }
        }

        function draw() {
            if (!gameStarted) return;
            ctx.save(); ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
            ctx.clearRect(-20, -20, canvas.width+40, canvas.height+40);
            if (timeStop > 0) {
    ctx.fillStyle = "rgba(200, 200, 255, 0.15)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}
            // HP Bar
            ctx.fillStyle = "#333"; ctx.fillRect(50, 40, canvas.width - 100, 8);
            ctx.fillStyle = (boss.hp < 1000) ? "red" : "#ff00ff"; ctx.fillRect(50, 40, (canvas.width - 100) * (boss.hp / boss.maxHp), 8);

let cycle = frame % 2400;

if (cycle >= 1200 && cycle < 1600 && bombTimer === 0) {
    if (timeStop <= 0) {
        lasers.forEach(l => l.draw());
    }
}

            // Master Spark (Marisa)
            if (bombTimer > 0 && currentPlayer === "marisa") {
                let sparkW = Math.sin(bombTimer * 0.1) * 20 + 120;
                let gradient = ctx.createLinearGradient(player.x - sparkW/2, 0, player.x + sparkW/2, 0);
                gradient.addColorStop(0, "rgba(255,255,200,0)"); gradient.addColorStop(0.5, "white"); gradient.addColorStop(1, "rgba(255,255,200,0)");
                ctx.fillStyle = gradient; ctx.fillRect(player.x - sparkW/2, 0, sparkW, player.y);
                ctx.fillStyle = "rgba(255,255,100,0.3)"; ctx.fillRect(player.x - sparkW, 0, sparkW*2, player.y);
            }

if (boss.hp <= 1000) {

    const ys = [120, 260, 400];

    ys.forEach(y => {
        ctx.drawImage(imgMamizou, 30, y - 40, 80, 80);
        ctx.drawImage(imgMamizou, canvas.width - 110, y - 40, 80, 80);
    });

}

            if (typeof imgMamizou !== 'undefined') {
                ctx.drawImage(imgMamizou, boss.x - 60, boss.y - 60, 120, 120);
            }

    let img = (currentPlayer === "reimu") ? imgReimu :
              (currentPlayer === "marisa") ? imgMarisa :
              imgSakuya;

    if (img && img.complete) {
        ctx.drawImage(img, player.x - 20, player.y - 20, 40, 40);
    } else {
        ctx.fillStyle = (currentPlayer === "reimu") ? "#44aaff" : "#ffff00";
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.visualR, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.fillStyle = "lime"; 
    ctx.beginPath(); 
    ctx.arc(player.x, player.y, 3, 0, Math.PI*2);
    ctx.fill();

            enemyBullets.forEach(b => b.draw());
            playerBullets.forEach(b => b.draw());
            bombEffects.forEach(orb => orb.draw());

            
            
            ctx.restore(); 
            update(); 
            requestAnimationFrame(draw);
        }
    </script>
</body>
